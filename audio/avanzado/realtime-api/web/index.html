<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎙️ Realtime API · Voz en Vivo 🚀✨</title>

  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="container">
    <header class="top">
      <h1>🎙️ Realtime API · Voz en Vivo 🚀✨</h1>
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Desconectado</span>
  <span id="micBadge" class="badge hidden" aria-live="polite"></span>
      </div>
    </header>

    <section class="controls">
      <button id="connectBtn" class="btn primary">Conectar</button>
      <button id="disconnectBtn" class="btn" disabled>Desconectar</button>
    </section>

    <section class="chat">
      <div id="messages" class="messages">
        <div class="welcome">
          <div class="emoji">🎤</div>
          <h2>Habla conmigo</h2>
          <p>Pulsa Conectar y concede permiso al micrófono.</p>
        </div>
      </div>

      <div id="flow" class="flow">
        <span id="sendingBadge" class="pill hidden">📤 Enviando<span class="dots"><span></span><span></span><span></span></span></span>
        <span id="receivingBadge" class="pill hidden">📥 Recibiendo<span class="dots"><span></span><span></span><span></span></span></span>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
