<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat por Voz - Demo Simple</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-microphone-lines"></i> Chat por Voz</h1>
            <p>Demostración simple con OpenAI Chat Completions API</p>
        </header>

        <main>
            <!-- Barra de estado -->
            <div class="status-bar">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Verificando conexión...</span>
            </div>

            <!-- Panel de control -->
            <div class="control-panel">
                <button id="recordBtn" class="record-btn" aria-label="Iniciar grabación">
                    <i class="fas fa-microphone"></i>
                </button>

                <div class="instructions" id="instructions">
                    Mantén presionado el botón para grabar (o usa la barra espaciadora)
                </div>
            </div>

            <!-- Estado de procesamiento -->
            <div id="processingStatus" class="processing-status hidden">
                <div class="spinner"></div>
                <span>Procesando audio y generando respuesta...</span>
            </div>

            <!-- Historial de conversación -->
            <div class="conversation-container">
                <div id="conversationHistory" class="conversation-history">
                    
                </div>
            </div>           
        </main>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>

</html>
