<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>📻 Radio AI Station - Generador de Audio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="radio-waves">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <div class="radio-header">
    <div class="radio-logo">📻</div>
    <div class="station-name">RADIO AI STATION</div>
    <div class="frequency">🔊 FM 104.7 AI 🔊</div>
  </div>

  <div class="container">
    <div class="on-air">🔴 ON AIR</div>
    
    <h1>🎙️ Estudio de Grabación IA 🎧</h1>
    
    <form id="audioForm">
      <div class="form-group">
        <label for="message">📝 ¿Qué quieres que diga tu locutor? 🗣️</label>
        <textarea id="message" placeholder="¡Escribe tu mensaje y conviértelo en audio profesional! 🎵" required>¡Hola developer! En este vídeo de mi serie sobre IA Generativa te muestro cómo puedes jugar con el audio</textarea>
      </div>

      <div class="form-group">
        <label>🎭 Elige tu locutor estrella 🌟</label>
        <div class="voice-grid">
          <div class="voice-option">
            <input type="radio" id="alloy" name="voice" value="alloy">
            <label for="alloy">🤖 Alloy<br><small>💼 Neutral Pro</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="echo" name="voice" value="echo" checked>
            <label for="echo">🎩 Echo<br><small>🏆 Profesional</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="fable" name="voice" value="fable">
            <label for="fable">🌟 Fable<br><small>😊 Juvenil</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="onyx" name="voice" value="onyx">
            <label for="onyx">💪 Onyx<br><small>🔥 Potente</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="nova" name="voice" value="nova">
            <label for="nova">✨ Nova<br><small>🌸 Suave</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="shimmer" name="voice" value="shimmer">
            <label for="shimmer">🌈 Shimmer<br><small>🎊 Optimista</small></label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-generate" id="generateBtn">
        🎬 ¡AL AIRE! Generar Audio 📻
      </button>
    </form>

    <div class="studio-container" id="studioContainer" style="display: none;">
      <div class="audio-controls">
        <audio id="audioPlayer" controls></audio>
        <canvas id="visualizer"></canvas>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
