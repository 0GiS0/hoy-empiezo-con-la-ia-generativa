<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>📻 Radio AI Station - Generador de Audio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', 'Monaco', monospace;
      background: 
        radial-gradient(circle at 20% 20%, #ff6b6b 0%, transparent 20%),
        radial-gradient(circle at 80% 80%, #4ecdc4 0%, transparent 20%),
        radial-gradient(circle at 40% 40%, #45b7d1 0%, transparent 20%),
        linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      padding: 1rem;
      color: #fff;
      overflow-x: hidden;
    }

    .radio-header {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
    }

    .radio-logo {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .station-name {
      font-size: 2.5rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: rainbow 3s ease-in-out infinite;
      margin-bottom: 0.5rem;
    }

    @keyframes rainbow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .frequency {
      font-size: 1.2rem;
      color: #4ecdc4;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 3rem;
      box-shadow: 
        0 0 50px rgba(78, 205, 196, 0.3),
        inset 0 0 50px rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(78, 205, 196, 0.3);
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
      border-radius: 25px;
      z-index: -1;
      animation: borderGlow 3s ease-in-out infinite;
    }

    @keyframes borderGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .on-air {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #ff6b6b;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: bold;
      animation: blink 1.5s infinite;
      box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.5; }
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.2rem;
      color: #4ecdc4;
      text-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
    }

    .form-group {
      margin-bottom: 2rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 1.5rem;
      border-radius: 15px;
      border: 1px solid rgba(78, 205, 196, 0.2);
    }

    label {
      display: block;
      margin-bottom: 1rem;
      font-weight: bold;
      color: #4ecdc4;
      font-size: 1.3rem;
      text-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
    }

    textarea {
      width: 100%;
      padding: 1.5rem;
      border: 2px solid #4ecdc4;
      border-radius: 15px;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-family: 'Courier New', monospace;
      transition: all 0.3s ease;
      resize: vertical;
      min-height: 120px;
    }

    textarea:focus {
      outline: none;
      border-color: #ff6b6b;
      box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
      background: rgba(0, 0, 0, 0.9);
    }

    .voice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .voice-option {
      position: relative;
    }

    .voice-option input[type="radio"] {
      display: none;
    }

    .voice-option label {
      display: block;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(78, 205, 196, 0.3);
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      font-weight: bold;
      margin-bottom: 0;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .voice-option label::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(78, 205, 196, 0.2), transparent);
      transition: left 0.5s;
    }

    .voice-option label:hover::before {
      left: 100%;
    }

    .voice-option input[type="radio"]:checked + label {
      background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
      border-color: #ff6b6b;
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
      animation: selectedVoice 0.5s ease-out;
    }

    @keyframes selectedVoice {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1.05); }
    }

    .voice-option label:hover {
      border-color: #4ecdc4;
      background: rgba(78, 205, 196, 0.2);
      transform: translateY(-3px);
      box-shadow: 0 5px 20px rgba(78, 205, 196, 0.3);
    }

    .btn-generate {
      width: 100%;
      padding: 1.5rem 2rem;
      background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 2rem;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Courier New', monospace;
    }

    .btn-generate::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .btn-generate:hover::before {
      left: 100%;
    }

    .btn-generate:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 40px rgba(255, 107, 107, 0.4);
    }

    .btn-generate:active {
      transform: translateY(-2px) scale(0.98);
    }

    .btn-generate:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .studio-container {
      background: 
        linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(26, 26, 46, 0.9)),
        radial-gradient(circle at center, rgba(78, 205, 196, 0.1) 0%, transparent 70%);
      border-radius: 25px;
      padding: 2.5rem;
      margin-top: 2rem;
      border: 2px solid rgba(78, 205, 196, 0.3);
      position: relative;
      overflow: hidden;
    }

    .studio-container::before {
      content: '🎚️ LIVE STUDIO 🎚️';
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(78, 205, 196, 0.2);
      padding: 0.5rem 1.5rem;
      border-radius: 20px;
      font-weight: bold;
      border: 1px solid rgba(78, 205, 196, 0.5);
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    audio {
      flex: 1;
      min-width: 300px;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.8);
      padding: 0.5rem;
    }

    #visualizer {
      width: 350px;
      height: 120px;
      background: radial-gradient(circle, #1a1a2e, #000);
      border-radius: 15px;
      border: 2px solid #4ecdc4;
      box-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
    }

    .status {
      color: #4ecdc4;
      margin-top: 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-shadow: 0 0 15px rgba(78, 205, 196, 0.5);
    }

    .loading {
      display: inline-block;
      width: 25px;
      height: 25px;
      border: 3px solid #4ecdc4;
      border-radius: 50%;
      border-top-color: #ff6b6b;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .radio-waves {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .wave {
      position: absolute;
      border: 2px solid rgba(78, 205, 196, 0.1);
      border-radius: 50%;
      animation: radioWaves 4s linear infinite;
    }

    .wave:nth-child(1) { width: 100px; height: 100px; top: 10%; left: 80%; }
    .wave:nth-child(2) { width: 150px; height: 150px; top: 60%; left: 10%; animation-delay: -1s; }
    .wave:nth-child(3) { width: 120px; height: 120px; top: 20%; left: 20%; animation-delay: -2s; }

    @keyframes radioWaves {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }

    @media (max-width: 768px) {
      body { padding: 0.5rem; }
      .container { padding: 2rem; }
      .station-name { font-size: 2rem; }
      .audio-controls { flex-direction: column; }
      #visualizer { width: 100%; }
      .voice-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="radio-waves">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <div class="radio-header">
    <div class="radio-logo">📻</div>
    <div class="station-name">RADIO AI STATION</div>
    <div class="frequency">🔊 FM 104.7 AI 🔊</div>
  </div>

  <div class="container">
    <div class="on-air">🔴 ON AIR</div>
    
    <h1>🎙️ Estudio de Grabación IA 🎧</h1>
    
    <form id="audioForm">
      <div class="form-group">
        <label for="message">📝 ¿Qué quieres que diga tu locutor? 🗣️</label>
        <textarea id="message" placeholder="¡Escribe tu mensaje y conviértelo en audio profesional! 🎵" required>🎉 ¡Hola radioescuchas! Bienvenidos a Radio AI Station, donde la inteligencia artificial se encuentra con la magia del audio. ¡Prepárense para una experiencia única! 🚀</textarea>
      </div>

      <div class="form-group">
        <label>🎭 Elige tu locutor estrella 🌟</label>
        <div class="voice-grid">
          <div class="voice-option">
            <input type="radio" id="alloy" name="voice" value="alloy">
            <label for="alloy">🤖 Alloy<br><small>💼 Neutral Pro</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="echo" name="voice" value="echo" checked>
            <label for="echo">🎩 Echo<br><small>🏆 Profesional</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="fable" name="voice" value="fable">
            <label for="fable">🌟 Fable<br><small>😊 Juvenil</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="onyx" name="voice" value="onyx">
            <label for="onyx">💪 Onyx<br><small>🔥 Potente</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="nova" name="voice" value="nova">
            <label for="nova">✨ Nova<br><small>🌸 Suave</small></label>
          </div>
          <div class="voice-option">
            <input type="radio" id="shimmer" name="voice" value="shimmer">
            <label for="shimmer">🌈 Shimmer<br><small>🎊 Optimista</small></label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-generate" id="generateBtn">
        🎬 ¡AL AIRE! Generar Audio 📻
      </button>
    </form>

    <div class="studio-container" id="studioContainer" style="display: none;">
      <div class="audio-controls">
        <audio id="audioPlayer" controls></audio>
        <canvas id="visualizer"></canvas>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <script type="module">
    import { setupAudioVisualizer } from './visualizer.js';
    
    const form = document.getElementById('audioForm');
    const audioPlayer = document.getElementById('audioPlayer');
    const statusDiv = document.getElementById('status');
    const visualizer = document.getElementById('visualizer');
    const generateBtn = document.getElementById('generateBtn');
    const studioContainer = document.getElementById('studioContainer');

    // Setup visualizer
    setupAudioVisualizer(audioPlayer, visualizer);

    form.onsubmit = async (e) => {
      e.preventDefault();
      
      // UI updates
      generateBtn.disabled = true;
      generateBtn.innerHTML = '⏳ Grabando en Estudio... 🎙️';
      studioContainer.style.display = 'block';
      audioPlayer.style.display = 'none';
      visualizer.style.display = 'none';
      statusDiv.innerHTML = '<div class="loading"></div> 🎵 Creando tu programa de radio con IA... 📻';
      
      const message = document.getElementById('message').value;
      const selectedVoice = document.querySelector('input[name="voice"]:checked');
      const voice = selectedVoice ? selectedVoice.value : 'echo';

      try {
        const response = await fetch('http://127.0.0.1:5000/generate-audio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, voice })
        });

        if (!response.ok) {
          throw new Error('💥 Error en la transmisión');
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        audioPlayer.src = url;
        
        // Show audio controls
        audioPlayer.style.display = 'block';
        visualizer.style.display = 'block';
        
        await audioPlayer.play();
        statusDiv.innerHTML = '🎉 ¡Transmisión exitosa! Al aire en Radio AI Station 📻✨';
        
      } catch (err) {
        statusDiv.innerHTML = '⚠️ Problemas técnicos: ' + err.message + ' 🔧';
      } finally {
        generateBtn.disabled = false;
        generateBtn.innerHTML = '🎬 ¡AL AIRE! Generar Audio 📻';
      }
    };
  </script>
</body>
</html>
