<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Chat LLM (LangChain) 🤖</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<div class="app">
		<header>
			<h1>🤖 Chat LLM <span class="tag">LangChain</span></h1>
			<div class="source-select">
				<label for="source">Fuente:</label>
				<select id="source">
					<option value="github" selected>GitHub Models</option>
					<option value="ollama">Ollama</option>
				</select>
			</div>
		</header>

		<main id="messages" aria-live="polite" aria-label="Historial de chat"></main>

		<div id="status" class="status" hidden></div>

		<form id="chat-form" autocomplete="off">
			<div class="toolbar">
				<button type="button" id="emoji-toggle" title="Emojis" aria-expanded="false">😊</button>
				<div id="emoji-panel" class="emoji-panel" hidden role="listbox" aria-label="Selecciona un emoji"></div>
			</div>
			<textarea id="input" rows="1" placeholder="Escribe tu mensaje..." required></textarea>
			<button id="send" type="submit" class="send">Enviar ➤</button>
		</form>
	</div>

	<template id="message-template">
		<article class="msg">
			<div class="avatar" data-role="avatar"></div>
			<div class="bubble" data-role="bubble"></div>
		</article>
	</template>

	<script src="chat.js" type="module"></script>
</body>
</html>
