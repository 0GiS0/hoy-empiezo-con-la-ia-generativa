<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Chat RAG (LangChain) 📑🦜🔗</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<div class="app">
		<header>
			<h1>📑 RAG con <span class="tag">LangChain 🦜🔗</span></h1>
		</header>

		<main id="messages" aria-live="polite" aria-label="Historial de chat"></main>

		<div id="status" class="status" hidden></div>

		<form id="chat-form" autocomplete="off">
			<textarea id="input" rows="1" placeholder="Escribe tu mensaje..." required></textarea>
			<button id="send" type="submit" class="send">Enviar</button>
		</form>
	</div>

	<!-- 📊 Panel de información de configuración (siempre visible) -->
	<aside id="config-panel" class="config-panel">
		<div class="config-header">
			<h3>⚙️ Configuración</h3>
		</div>
		<div class="config-content">
			<div class="config-loading">Cargando...</div>
			
			<!-- Las secciones se llenarán con JavaScript -->
			<div id="config-models" class="config-section" style="display: none;">
				<h4>🤖 Modelos LLM</h4>
				<div class="config-item">
					<div class="config-label">Router</div>
					<div class="config-value" id="router-model"></div>
				</div>
				<div class="config-item">
					<div class="config-label">Respuesta</div>
					<div class="config-value" id="answer-model"></div>
				</div>
				<div class="config-item">
					<div class="config-label">Embeddings</div>
					<div class="config-value" id="embeddings-model"></div>
				</div>
			</div>

			<div id="config-provider" class="config-section" style="display: none;">
				<h4>🔌 Proveedor</h4>
				<div class="config-item">
					<div class="config-label">Proveedor</div>
					<div class="config-value" id="provider-name"></div>
				</div>
				<div class="config-item">
					<div class="config-label">Endpoint URL</div>
					<div class="config-value" id="endpoint-url"></div>
				</div>
				<div class="config-item">
					<div class="config-label">Model Provider</div>
					<div class="config-value" id="model-provider"></div>
				</div>
			</div>

			<div id="config-vectorstore" class="config-section" style="display: none;">
				<h4>🗄️ Vector Store</h4>
				<div class="config-item">
					<div class="config-label">Colección</div>
					<div class="config-value" id="collection-name"></div>
				</div>
				<div class="config-item">
					<div class="config-label">Documentos</div>
					<div class="config-value">
						<span id="doc-count"></span>
						<span id="doc-status" class="config-status"></span>
					</div>
				</div>
				<div class="config-item">
					<div class="config-label">Docs/Consulta</div>
					<div class="config-value" id="k-documents"></div>
				</div>
			</div>
		</div>
	</aside>

	<template id="message-template">
		<article class="msg">
			<div class="avatar" data-role="avatar"></div>
			<div class="bubble" data-role="bubble"></div>
		</article>
	</template>

	<script src="chat.js" type="module"></script>
</body>
</html>
